---
- name: Install and configure frontend
  hosts: frontend
  become: true
  tasks:

    - name: Install nginx
      package:
        name: nginx
        state: present

    - name: Find all contents inside the directory
      ansible.builtin.find:
        paths: /usr/share/nginx/html/
        recurse: true
        hidden: true
        file_type: any
      register: directory_contents

    - name: print directory content
      debug:
        msg: "{{ directory_contents }}"

    - name: Delete the discovered contents
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ directory_contents.files }}"

    - name: Download frontend application
      get_url:
        url: https://raw.githubusercontent.com/daws-92s/expense-documentation/refs/heads/main/artifacts/expense-frontend-v5.tar.gz
        dest: /tmp/frontend.tar.gz

    - name: Extract files directly into the Nginx web
      unarchive:
        src: /tmp/frontend.tar.gz
        dest: /usr/share/nginx/html
        remote_src: yes

    - name: Configure Nginx Reverse Proxy
      template:
        src: expense-conf.j2
        dest: /etc/nginx/default.d/expense.conf

    - name: start and enable nginx
      systemd_service:
        name: nginx
        daemon_reload: true
        state: restarted
        enabled: true
