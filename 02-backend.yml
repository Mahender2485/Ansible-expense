---
- name: Install and configure backend service
  hosts: backend
  become: true
  tasks:

    - name: disable nodejs
      command: dnf module disable nodejs -y

    - name: enable nodejs 24
      command: dnf module enable nodejs:24 -y

    - name: Install nodejs 24
      package:
        name: nodejs
        state: present

    - name: Add a system user to run the application
      user:
        name: expense
        create_home: false
        home: /app
        system: true
        shell: /sbin/nologin
        comment: "expense system user"
        state: present

    - name: Remove app dir if already exists
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /app
        - /tmp/backend.tar.gz
    
    - name: Create App dir
      file:
        path: /app
        state: directory
    
    - name: download application file
      get_url:
        url: https://raw.githubusercontent.com/daws-92s/expense-documentation/refs/heads/main/artifacts/expense-backend-v5.tar.gz
        dest: /tmp/backend.tar.gz

    - name: Extract application file into /app
      unarchive:
        src: /tmp/backend.tar.gz
        dest: /app
        remote_src: true

    - name: Install Dependencies
      community.general.npm:
        path: /app

    - name: Configure SystemD Service
      template:
        src: backend-service.j2
        dest: /etc/systemd/system/backend.service
    
    - name: Install mysql client
      package:
        name: mysql
        state: present

    - name: Load Database Schema
      shell: mysql -h "{{ mysql_host }}" -u root -p{{ expense_db_user_password }} < /app/schema/backend.sql

    - name: start backend services
      systemd_service:
        name: backend
        daemon_reload: true
        stste: restsrted
        enabled: true