---
- name: Create EC2 instance for roboshop project
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    aws_region: us-east-1
    ami_id: ami-0055977a6e828a4f4
    domain_name: mahender.org
    instance_type: t3.micro
    action: create
    instances:
      - name: mysql
        port: 3306
      - name: backend
        port: 8080
      - name: frontend
        port: 80
      - name: loadbalancer
        port: 80
      
  tasks:
    - name: Create Common Security Group
      amazon.aws.ec2_security_group:
        name: roboshop_common
        description: "Common SG for RoboShop"
        region: "{{ aws_region }}"
        rules:
          - proto: tcp
            ports:
              - 22
            cidr_ip: 184.190.96.180/32
        state: present

    - name: Create Instance specific Security Groups #Create security groups for all the services
      amazon.aws.ec2_security_group:
        name: "expence-{{ item.name }}"
        description: "SG for {{ item.name }}"
        region: "{{ aws_region }}"
        rules:
          - proto: tcp
            ports:
              - "{{ item.port | int }}"
            cidr_ip: 0.0.0.0/0
        state: present
      loop: "{{ instances }}"
      loop_control:
        label: "{{ item.name }}"
      when: action == "create"
    
    - name: Create EC2 Instances # Create EC2 instances for all the services
      amazon.aws.ec2_instance:
        name: "roboshop-{{ item.name }}"
        state: running
        instance_type: "{{ instance_type }}"
        image_id: "{{ ami_id }}"
        region: "{{ aws_region }}"
        security_groups:
          - roboshop_common
          - "roboshop-{{ item.name }}"
        wait: true
      loop: "{{ instances }}"
      when: action == "create"
      register: ec2_output

    - name: Add Route53 Record for EC2 Instances # To add route53 records
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "{{ item.item.name }}.{{ domain_name }}"
        type: A
        ttl: 1
        value: "{{ item.instances[0].private_ip_address | string | trim }}"
        overwrite: true
      loop: "{{ ec2_output.results }}"
      when: action == "create"

    - name: Delete R53 Record
      amazon.aws.route53:
        state: absent
        zone: "{{ domain_name }}"
        record: "{{ item.name }}.{{ domain_name }}"
        ttl: 1
        type: A
      loop: "{{ instances }}"
      when: action == "delete"
    - name: Delete EC2 Instances
      amazon.aws.ec2_instance:
        state: absent
        name: "roboshop-{{ item.name }}"
        region: "{{ aws_region }}"
      loop: "{{ instances }}" 
      when: action == "delete"

    - name: Delete Instance Specific Security Groups
      amazon.aws.ec2_security_group:
        name: "roboshop-{{ item.name }}"
        region: "{{ aws_region }}"
        state: absent
      loop: "{{ instances }}"
      when: action == "delete"  
    
    - name: Delete Common Security Group
      amazon.aws.ec2_security_group:
        name: roboshop_common
        region: "{{ aws_region }}"
        state: absent
      when: action == "delete"

